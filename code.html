<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/code.css">
    <title>To-Do List</title>
  </head>

  <body>
    <main class="app">
      <header class="appHeader">
        <h1>My tasks</h1>
        <p id="counter" class="counter"></p>
      </header>

      <form id="taskForm" class="taskForm">
        <label for="taskInput">New task</label>
        <div class="inputRow">
          <input type="text" id="taskInput" placeholder="What do you need to do?">
          <button type="submit" class="addButton">Add</button>
        </div>
        <p id="message" class="message"></p>
      </form>

      <div id="sections" class="sections">
        <section class="taskSection">
          <h2 class="sectionTitle">
            Pending
            <span id="pendingCount" class="sectionCount">0</span>
          </h2>
          <ul id="pendingList" class="taskList"></ul>
          <p id="pendingEmpty" class="sectionEmpty">Nothing pending. You're all caught up!</p>
        </section>

        <section class="taskSection completedSection">
          <h2 class="sectionTitle">
            Completed
            <span id="completedCount" class="sectionCount">0</span>
          </h2>
          <ul id="completedList" class="taskList"></ul>
          <p id="completedEmpty" class="sectionEmpty">No completed tasks yet.</p>
        </section>
      </div>

      <p id="emptyState" class="emptyState">No tasks yet. Add your first one above.</p>
    </main>

    <script src="scripts/code.js"></script>
  </body>
</html>
